name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ARTIFACT_NAME: FeatherLauncher-portable-win-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore FeatherLauncher.slnx
      - run: dotnet format FeatherLauncher.slnx --verify-no-changes --no-restore
      - run: dotnet build FeatherLauncher.slnx --configuration Release --no-restore
      - run: dotnet test FeatherLauncher.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet publish src/FeatherLauncher.Desktop/FeatherLauncher.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - run: cd artifacts/win-x64 && zip -9 -r ../${ARTIFACT_NAME}.zip .
      - run: unzip -t artifacts/${ARTIFACT_NAME}.zip && unzip -l artifacts/${ARTIFACT_NAME}.zip | grep FeatherLauncher
      - run: dotnet list FeatherLauncher.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

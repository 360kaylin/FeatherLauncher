name: Windows live authentication test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ARTIFACT_NAME: FeatherLauncher-live-auth-test-win-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore FeatherLauncher.slnx
      - run: dotnet format FeatherLauncher.slnx --verify-no-changes --no-restore
      - run: dotnet build FeatherLauncher.slnx -c Release --no-restore
      - run: dotnet test FeatherLauncher.slnx -c Release --no-build --no-restore
      - run: dotnet list FeatherLauncher.slnx package --vulnerable --include-transitive
      - run: dotnet publish src/FeatherLauncher.Desktop/FeatherLauncher.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/${env:ARTIFACT_NAME}.zip
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("artifacts/${env:ARTIFACT_NAME}.zip")
          if ($zip.Entries.Count -eq 0 -or -not ($zip.Entries.Name -contains 'FeatherLauncher.Desktop.exe')) { throw 'Portable ZIP integrity validation failed.' }
          $zip.Dispose()
          (Get-FileHash "artifacts/${env:ARTIFACT_NAME}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${env:ARTIFACT_NAME}.zip" | Set-Content "artifacts/${env:ARTIFACT_NAME}.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            artifacts/${{ env.ARTIFACT_NAME }}.zip
            artifacts/${{ env.ARTIFACT_NAME }}.zip.sha256
          if-no-files-found: error
